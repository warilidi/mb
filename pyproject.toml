[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motivation-bot"
version = "0.1.0"
description = "Gamified motivation Telegram bot built with aiogram 3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
motivation-bot = "motivation_bot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motivation_bot = ["data/*.json", "data/locales/*.json"]

